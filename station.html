<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Station Gantt Chart</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/gantt.css" />
  <link rel="stylesheet" href="css/station.css" />
</head>

<body class="station-page">
  <div class="appShell">
    <nav class="sideNav" aria-label="Main navigation">
      <div class="sideNavBrand">
        <div class="sideNavTitle">Project Tracking</div>
        <div class="sideNavSub">Dashboard views</div>
      </div>
      <div class="sideNavGroup">
        <a class="sideNavLink" data-nav-item="project-gantt" href="index.html">Project Gantt</a>
        <a class="sideNavLink active" data-nav-item="station-gantt" href="station.html" aria-current="page">Station Gantt</a>
        <a class="sideNavLink" data-nav-item="tree-view" href="tree.html">Tree View</a>
        <a class="sideNavLink" data-nav-item="line-balance" href="line-balance.html">Line Balance</a>
        <a class="sideNavLink" data-nav-item="processes" href="processes.html">Process Description</a>
        <a class="sideNavLink" data-nav-item="acknowledgement" href="acknowledgement.html">Acknowledgement</a>
      </div>
    </nav>

  <div class="wrap">
    <header class="top">
      <div>
        <h2>Station Gantt Chart</h2>
      </div>

    </header>

    <section class="card">
      <div class="toolbar ganttTopBar">
        <!-- Row 1: Legend -->
        <div class="legendTopRow">
          <div class="legendBlock">
            <div class="legendInlineSection">
              <div class="hint">STATIONS:</div>
              <div id="legendStations" class="legendRow"></div>
            </div>

            <div class="legendInlineSection statusSection">
              <div class="hint">STATUS:</div>
              <div id="legendStatus" class="legendRow"></div>
            </div>
          </div>
        </div>

        <div class="controlsRow">
          <div class="pickerSlot">
            <div id="daySlot" class="pickerGroup">
              <div class="pickerLabel">Day</div>
              <input type="date" id="dayPicker" class="pickerInput" />
            </div>
          </div>


          
          <div class="toolbar stationControlGroup">
            <div class="hint">STATION:</div>
            <div class="stationControlRow">
              <select id="stationBalancePicker"></select>

              <button id="btn-refresh">Refresh</button>

              <button id="btnExportStationExcel" class="btn primary">
                Export Excel File
              </button>
            </div>
            
        </div>

        </div>
      </div>

      <div id="stationViewTitle" class="stationViewTitle">Station</div>

      <div class="ganttWrap stationMode">
        <div class="ganttGrid stationMode">
          <div class="ganttHead">
            <div class="ganttLeftHead small">Process</div>
            <div class="ganttLeftHead small">Project</div>
            <div class="ganttLeftHead small">Status</div>

            <div class="ganttTimelineHead">
              <div id="ganttMonthHead" class="ganttMonthHead"></div>
              <div id="ganttDayHead" class="ganttDayHead"></div>
            </div>
          </div>

          <div id="ganttBody"></div>

        </div>
    </div>
    </section>

  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script type="module">
    import { clearCache } from "./js/timeline.js";
    import { 
      renderStationOnlyView, 
      clearGanttCache,
      stopGanttLiveRefresh,
      exportStationSelectedDateExcel
    } from "./js/gantt.js";

    const btnRefresh = document.getElementById("btn-refresh");
    const dayPicker = document.getElementById("dayPicker");

    async function renderPage() {
      await renderStationOnlyView();
    }

    renderPage();
    import(`./js/version-check.js?v=${Date.now()}`)
      .then(({ startVersionCheck }) => startVersionCheck())
      .catch(err => console.warn("Version check failed to start", err));

    btnRefresh?.addEventListener("click", async () => {
      const originalText = btnRefresh.textContent;

      try {
        btnRefresh.disabled = true;
        btnRefresh.textContent = "Refreshing...";

        stopGanttLiveRefresh();
        clearCache();
        clearGanttCache();
        await renderPage();
      } catch (err) {
        console.error("Refresh failed:", err);
      } finally {
        btnRefresh.disabled = false;
        btnRefresh.textContent = originalText || "Refresh";
      }
    });

    dayPicker?.addEventListener("change", async () => {
      await renderPage();
    });

    window.addEventListener("beforeunload", () => {
      stopGanttLiveRefresh();
    });
  </script>
</body>
</html>
