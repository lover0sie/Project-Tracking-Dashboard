<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Process Description</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="processPage">
  <div class="wrap">
    <!-- Mirror dashboard structure here so both pages feel consistent. -->
    <header class="top">
      <div>
        <h2>Process Description</h2>
        <div class="sub">Data extracted from <b>Firestore</b></div>
      </div>

      <div class="actions">
        <a class="btn secondary" href="index.html">Back to Dashboard</a>
      </div>
    </header>

    <section class="card">
        <!-- Use this selector to switch which station's process steps are shown. -->
        <div class="toolbar">
            <div class="hint">Select a unit type to see its process list.</div>

            <div class="filters">
            <label for="stationPick">Unit Type</label>
            <select id="stationPick"></select>
            </div>
          </div>

        <div class="processWrap">
          <div class="processContainer">
              <!-- Let JavaScript inject the process list HTML into this block. -->
              <div id="processList"></div>
          </div>
        </div>
    </section>

  </div>

  <!-- Keep process page behavior in a small dedicated module. -->
  <script type="module" src="js/processes.js"></script>
  <script type="module">
    import(`./js/version-check.js?v=${Date.now()}`)
      .then(({ startVersionCheck }) => startVersionCheck())
      .catch(err => console.warn("Version check failed to start", err));
  </script>
</body>
</html>
