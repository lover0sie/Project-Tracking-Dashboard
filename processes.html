<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Process Description</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/processes.css" />
</head>

<body class="processPage">
  <div class="appShell">
    <nav class="sideNav" aria-label="Main navigation">
      <div class="sideNavBrand">
        <div class="sideNavTitle">Project Tracking</div>
        <div class="sideNavSub">Dashboard views</div>
      </div>
      <div class="sideNavGroup">
        <a class="sideNavLink" data-nav-item="project-gantt" href="index.html">Project Gantt</a>
        <a class="sideNavLink" data-nav-item="station-gantt" href="station.html">Station Gantt</a>
        <a class="sideNavLink" data-nav-item="tree-view" href="tree.html">Tree View</a>
        <a class="sideNavLink" data-nav-item="line-balance" href="line-balance.html">Line Balance</a>
        <a class="sideNavLink active" data-nav-item="processes" href="processes.html" aria-current="page">Process Description</a>
        <a class="sideNavLink" data-nav-item="acknowledgement" href="acknowledgement.html">Acknowledgement</a>
      </div>
    </nav>

  <div class="wrap">
    <!-- Mirror dashboard structure here so both pages feel consistent. -->
    <header class="top">
      <div>
        <h2>Process Description</h2>
      </div>

      <div class="actions"></div>
    </header>

    <section class="card">
        <!-- Use this selector to switch which station's process steps are shown. -->
        <div class="toolbar">
            <div class="hint">Select a unit type to see its process list.</div>

            <div class="filters">
            <label for="stationPick">Unit Type</label>
            <select id="stationPick"></select>
            </div>
          </div>

        <div class="processWrap">
          <div class="processContainer">
              <!-- Let JavaScript inject the process list HTML into this block. -->
              <div id="processList"></div>
          </div>
        </div>
    </section>

  </div>
  </div>

  <!-- Keep process page behavior in a small dedicated module. -->
  <script type="module" src="js/processes.js"></script>
  <script type="module">
    import(`./js/version-check.js?v=${Date.now()}`)
      .then(({ startVersionCheck }) => startVersionCheck())
      .catch(err => console.warn("Version check failed to start", err));
  </script>
</body>
</html>
