<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Project Tracking Dashboard</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="wrap">
    <!-- Keep the dashboard title and global actions in one header for quick navigation. -->
    <header class="top">
      <div>
        <h2>Project Tracking Dashboard</h2>
        <div class="sub">Data extracted from <b>Firestore</b></div>
      </div>

      <div class="actions">
        <button id="btn-gantt" class="secondary">Timeline View</button>
        <button id="btn-tree" class="secondary">Tree View</button>
        <button id="btn-refresh" class="secondary">Refresh</button>
        <a class="btn secondary" href="processes.html">Process Description</a>
        <button id="btn-export">Export Excel File</button>
      </div>
    </header>


    <section class="card">
      <!-- Use this toolbar to hold usage hints, legend output, and date-range controls. -->
      <div class="toolbar">
        <div class="hint">
          Hover a bar to see manpower and duration.
        </div>

        <div id="legendStations" class="legendRow"></div>

        <div class="filters">
          <label for="dateMode">Date Range</label>
          <select id="dateMode">
            <option value="thisMonth">This month</option>
            <option value="lastMonth">Last month</option>
            <option value="last3Months">Last 3 months</option>
            <option value="last6Months">Last 6 months</option>
            <option value="auto">Auto (from data)</option>
          </select>
        </div>
      </div>

      <!-- Gantt -->
      <div class="ganttWrap">
        <div class="ganttGrid">
          <!-- Split timeline headers into month row and day row so both can scroll together. -->
          <div class="ganttHead">
            <div id="colHead1" class="ganttLeftHead">Project</div>
            <div id="colHead2" class="ganttLeftHead small">Current Process No.</div>
            <div id="colHead3" class="ganttLeftHead small">Status</div>

            <div id="timelineHead" class="ganttTimelineHead">
              <div id="ganttMonthHead" class="monthHead"></div>
              <div id="ganttDayHead" class="dayHead"></div>
            </div>
          </div>

          <!-- Render project rows from JavaScript into this container. -->
          <div id="ganttBody" class="ganttBody"></div>
        </div>
      </div>
    </section>
  </div>

  

<!-- Export to Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- View Controller -->
<script type="module">
  import { renderTree } from "./js/tree.js";
  import { renderGanttView } from "./js/gantt.js";
  import { clearCache } from "./js/timeline.js";

  const btnTree = document.getElementById("btn-tree");
  const btnGantt = document.getElementById("btn-gantt");
  const btnRefresh = document.getElementById("btn-refresh");

  function setTreeHeaders() {
    document.getElementById("timelineHead")?.classList.add("hidden");

    // hide entire gantt header row
    document.querySelector(".ganttHead")?.classList.add("hidden");
  }

  function setGanttHeaders() {
    document.getElementById("timelineHead")?.classList.remove("hidden");
    document.querySelector(".ganttHead")?.classList.remove("hidden");
  }

  // Default view = Gantt
  setGanttHeaders();
  renderGanttView();

  btnTree.addEventListener("click", async () => {
    setTreeHeaders();
    await renderTree();
  });

  btnGantt.addEventListener("click", async () => {
    setGanttHeaders();
    await renderGanttView();
  });

  btnRefresh.addEventListener("click", async () => {
    clearCache();
    if (document.getElementById("timelineHead").classList.contains("hidden")) {
      await renderTree();
    } else {
      await renderGanttView();
    }
  });

</script>
</body>
</html>
