<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Project Tracking Dashboard</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="dashboardPage">
  <div class="wrap">
    <!-- Keep the dashboard title and global actions in one header for quick navigation. -->
    <header class="top">
      <div>
        <h2>Project Tracking Dashboard</h2>
        <div class="sub">Data extracted from <b>Firestore</b></div>
      </div>

      <div class="actions">
          <button id="btn-refresh">Refresh</button>
          <a class="btn secondary" href="processes.html">Process Description</a>
          <a class="btn secondary" href="station.html">Station View</a>
          <a class="btn secondary" href="line-balance.html">Line Balance</a>
          <button id="btnAutoStop">Run Auto Stop</button>
          <button id="btn-export">Export Excel File</button>
      </div>
    </header>


    <section class="card">
      <div class="toolbar ganttTopBar">
        <!-- Row 1: Legend -->
        <div class="legendTopRow">
          <div class="legendBlock">
            <div class="legendInlineSection">
              <div class="hint">STATIONS:</div>
              <div id="legendStations" class="legendRow"></div>
            </div>

            <div class="legendInlineSection statusSection">
              <div class="hint">STATUS:</div>
              <div id="legendStatus" class="legendRow"></div>
            </div>
          </div>
        </div>

        <!-- Row 2: Controls -->
        <div class="controlsRow">
          <div class="pickerSlot">
            <div id="daySlot" class="pickerGroup">
              <div class="pickerLabel">Day</div>
              <input type="date" id="dayPicker" class="pickerInput" />
            </div>

            <div id="monthSlot" class="pickerGroup hidden">
              <div class="pickerLabel">Month</div>
              <input type="month" id="monthPicker" class="pickerInput" />
            </div>

            <button id="btnToday" class="secondary hidden">Today</button>
          </div>

          <div class="filters">
            <div>
              <label for="viewMode">View</label>
              <select id="viewMode">
                <option value="gantt">Gantt</option>
                <option value="tree">Tree</option>
              </select>
            </div>

            <div>
              <label for="dateMode">Date Range</label>
              <select id="dateMode">
                <option value="daily">Daily</option>
                <option value="month">Monthly</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="ganttWrap">
        <div class="ganttGrid">
          <div class="ganttHead">
            <div class="ganttLeftHead">Unit</div>
            <div class="ganttLeftHead small">Process No.</div>
            <div class="ganttLeftHead small">Status</div>

            <div class="ganttTimelineHead">
              <div id="ganttMonthHead" class="ganttMonthHead"></div>
              <div id="ganttDayHead" class="ganttDayHead"></div>
            </div>
          </div>

          <div id="ganttBody"></div>
        </div>
      </div>
    </section>
  </div>

  

<!-- Export to Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- View Controller -->
 
<script type="module">
  import { renderTree } from "./js/tree.js";
  import { clearCache } from "./js/timeline.js";
  import { renderGanttView, syncPickers, stopGanttLiveRefresh, updateGanttLeftHeaders } from "./js/gantt.js";
  import { startVersionCheck } from "./js/version-check.js";

  const btnRefresh = document.getElementById("btn-refresh");
  const viewMode = document.getElementById("viewMode");
  const dayPicker = document.getElementById("dayPicker");
  const monthPicker = document.getElementById("monthPicker");
  const dateMode = document.getElementById("dateMode");
  const btnToday = document.getElementById("btnToday");

  let currentView = viewMode?.value || "gantt";

  function setTreeHeaders() {
    document.getElementById("timelineHead")?.classList.add("hidden");
    document.querySelector(".ganttHead")?.classList.add("hidden");
  }

  function setGanttHeaders() {
    document.getElementById("timelineHead")?.classList.remove("hidden");
    document.querySelector(".ganttHead")?.classList.remove("hidden");
  }

  async function renderCurrentView() {
    syncPickers();
    updateGanttLeftHeaders();

    if (currentView === "tree") {
      stopGanttLiveRefresh();
      setTreeHeaders();
      await renderTree();
    } else {
      setGanttHeaders();
      await renderGanttView();
    }
  } 

  // Default view = Gantt
  currentView = "gantt";
  renderCurrentView();
  startVersionCheck();

  viewMode?.addEventListener("change", async () => {
    currentView = viewMode.value;
    await renderCurrentView();
  });

  btnRefresh?.addEventListener("click", async () => {
    const originalText = btnRefresh.textContent;

    try {
      btnRefresh.disabled = true;
      btnRefresh.textContent = "Refreshing...";

      stopGanttLiveRefresh();     // avoid old timer during refresh
      clearCache();
      await renderCurrentView();
    } catch (err) {
      console.error("Refresh failed:", err);
    } finally {
      btnRefresh.disabled = false;
      btnRefresh.textContent = originalText || "Refresh";
    }
  });

  dayPicker?.addEventListener("change", async () => {
    await renderCurrentView();
  });

  monthPicker?.addEventListener("change", async () => {
    await renderCurrentView();
  });

  dateMode?.addEventListener("change", async () => {
    await renderCurrentView();
  });

  btnToday?.addEventListener("click", async () => {
    const today = new Date();
    const monthStr = today.toISOString().slice(0, 7);

    if (monthPicker) monthPicker.value = monthStr;
    await renderCurrentView();
  });

  window.addEventListener("beforeunload", () => {
    stopGanttLiveRefresh();
  });
</script>

</body>
</html>
