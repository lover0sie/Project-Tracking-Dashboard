<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timeline View</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h2>Project Timeline (Gantt)</h2>
        <div class="sub">Data extracted from <b>Firestore</b></div>
      </div>

      <div class="actions">
        <a class="btn secondary" href="index.html">Tree View</a>
        <button id="btn-refresh" class="secondary">Refresh</button>
        <button id="btn-export">Export Excel File</button>
      </div>
    </header>

    <!-- KEEP your existing gantt layout here -->
    <section class="card">
      <div class="toolbar">
        <div class="hint">
          Hover a bar to see manpower and duration.
        </div>

        <div id="legendStations" class="legendRow"></div>

        <div class="filters">
          <label for="dateMode">Date Range</label>
          <select id="dateMode">
            <option value="thisMonth">This month</option>
            <option value="lastMonth">Last month</option>
            <option value="last3Months">Last 3 months</option>
            <option value="last6Months">Last 6 months</option>
            <option value="auto">Auto (from data)</option>
          </select>
        </div>
      </div>

      <div class="ganttWrap">
        <div class="ganttGrid">
          <div class="ganttHead">
            <div class="ganttLeftHead">Project</div>
            <div class="ganttLeftHead small">Current Process No.</div>
            <div class="ganttLeftHead small">Status</div>

            <div class="ganttTimelineHead">
              <div id="ganttMonthHead" class="monthHead"></div>
              <div id="ganttDayHead" class="dayHead"></div>
            </div>
          </div>

          <div id="ganttBody" class="ganttBody"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/gantt.js"></script>
</body>
</html>
