<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Line Balance Graph</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="lineBalancePage">
  <header class="top">
    <div>
      <h2>Line Balance Graph</h2>
      <div class="sub">Select a project, then choose CHILLER or PV view</div>
    </div>
  </header>

  <section class="card">
    <div class="toolbar lineBalanceToolbar">
      <div class="toolbarGroup">
        <label for="lbQrKindView">View</label>
        <select id="lbQrKindView" class="pickerInput">
          <option value="CHILLER">CHILLER</option>
          <option value="PV">PV</option>
        </select>
      </div>

      <div class="toolbarGroup infoGroup">
        <label>Total Projects</label>
        <div id="lbProjectCount" class="infoText">0</div>
      </div>

      <div class="toolbarGroup infoGroup">
        <label>Selected Project</label>
        <div id="lbProjectName" class="infoText">-</div>
      </div>

      <div class="toolbarGroup infoGroup">
        <label>Chiller Serial Number</label>
        <div id="lbChillerSerial" class="infoText">-</div>
      </div>

      <div class="toolbarGroup pushRight">
        <a class="btn secondary" href="index.html">Back to Dashboard</a>
      </div>
    </div>

    <div class="lineBalanceLayout">
      <div class="projectListPanel">
        <div class="projectListHeader">
          <div class="sectionTitle">All Projects</div>
        </div>

        <div class="projectSearchWrap">
          <div class="searchPill">
            <span class="searchIcon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"></circle>
                <path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
              </svg>
            </span>

            <input
              type="text"
              id="lbProjectSearch"
              class="searchPillInput"
              placeholder="Search"
              autocomplete="off"
            />

            <button
              type="button"
              id="lbProjectSearchClear"
              class="searchClearBtn"
              aria-label="Clear search"
              title="Clear search"
            >
              ×
            </button>

          </div>

          <div class="filterSortWrap">
            <button
              type="button"
              id="lbProjectSort"
              class="filterPillBtn"
              aria-expanded="false"
              aria-controls="lbProjectSortMenu"
              aria-label="Sort projects"
              title="Sort projects"
            >
              <span class="filterPillIcon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M4 7h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                  <circle cx="17" cy="7" r="2" stroke="currentColor" stroke-width="2"></circle>
                  <path d="M20 17H10" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                  <circle cx="7" cy="17" r="2" stroke="currentColor" stroke-width="2"></circle>
                  <path d="M4 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                  <path d="M12 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                </svg>
              </span>
            </button>

            <div id="lbProjectSortMenu" class="filterSortMenu" hidden>
              <button type="button" data-sort="latest">Latest update first</button>
              <button type="button" data-sort="oldest">Oldest update first</button>
              <button type="button" data-sort="az">Project in Ascending Order</button>
              <button type="button" data-sort="za">Project in Descending Order</button>
            </div>
          </div>
        </div>

        

        <div id="lbProjectList" class="projectList">
          <div class="emptyState">No projects loaded yet.</div>
        </div>
      </div>

      <div class="chartPanel">
      <div id="lineBalanceCharts" class="lineBalanceCharts">
        <div class="emptyState">Select a project to view line balance.</div>
      </div>
    </div>
    </div>

    
  </section>


  <script type="module" src="js/line-balance.js"></script>
  <script type="module">
    import(`./js/version-check.js?v=${Date.now()}`)
      .then(({ startVersionCheck }) => startVersionCheck())
      .catch(err => console.warn("Version check failed to start", err));
  </script>
</body>
</html>
